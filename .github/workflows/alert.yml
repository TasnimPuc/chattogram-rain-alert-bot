# Move this file to .github/workflows/alert.yml
name: rain-alert
on:
  schedule:
    - cron: "7 */3 * * *"          # every 3 hours (UTC; Dhaka = UTC+6). In monsoon you can use "7 * * * *" (hourly)
  workflow_dispatch: {}
permissions:
  contents: write                  # commit state/state.json + docs/status.json
  actions: write                   # keep the schedule from being auto-disabled after 60 quiet days
concurrency:
  group: rain-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Forecast, risk, Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main run
      - name: Save state + status page
        run: |
          git config user.name "rain-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json docs/status.json
          git diff --cached --quiet || (git commit -m "status update [skip ci]" && git pull --rebase && git push)
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/alert.yml/enable" || true
