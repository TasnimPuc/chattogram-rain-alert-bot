# Move this file to .github/workflows/ci.yml
name: ci
on:
  push:
    paths-ignore: ["state/**", "docs/status.json", "results/**"]
  pull_request: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q    # Open-Meteo + Telegram are mocked: no network, no secrets needed
