# Move this file to .github/workflows/backtest.yml — run it manually (Actions -> backtest -> Run workflow)
name: backtest
on:
  workflow_dispatch:
    inputs:
      start: {description: "start date", default: "2010-01-01"}
      end: {description: "end date", default: "2024-12-31"}
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m src.main backtest --start ${{ inputs.start }} --end ${{ inputs.end }}
      - run: |
          git config user.name "rain-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest.md
          git diff --cached --quiet || (git commit -m "backtest results [skip ci]" && git pull --rebase && git push)
